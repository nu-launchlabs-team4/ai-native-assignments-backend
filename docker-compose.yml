services:
  api:
    build:
      context: .
      args:
        # The Claude Code CLI for AI_PROVIDER=claude_code (local development only).
        INSTALL_CLAUDE_CODE: "true"
    env_file: .env
    ports:
      - "8010:8000"
    volumes:
      - ./app:/code/app
      - ./tests:/code/tests
      - ./migrations:/code/migrations
      - ./alembic.ini:/code/alembic.ini
      - ./pyproject.toml:/code/pyproject.toml
